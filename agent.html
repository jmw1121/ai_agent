<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 에이전트</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #111;
    color: #fff;
  }
  header {
    padding: 1.25rem 1.5rem 1rem;
    border-bottom: 1px solid #2a2a2a;
  }
  header h1 {
    font-size: 1.25rem;
    margin: 0;
  }
  header p {
    margin: 0.35rem 0 0;
    font-size: 0.85rem;
    color: #888;
  }
  .back-link {
    display: inline-block;
    margin-top: 0.75rem;
    color: #fff;
    text-decoration: none;
    opacity: 0.7;
    font-size: 0.85rem;
  }
  .back-link:hover { opacity: 1; }

  main {
    flex: 1;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    overflow-y: auto;
  }
  .msg {
    max-width: 85%;
    padding: 0.7rem 1rem;
    border-radius: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: #fff;
    color: #111;
  }
  .msg.bot {
    align-self: flex-start;
    background: #1e1e1e;
    border: 1px solid #2a2a2a;
  }
  .msg.bot.loading {
    color: #888;
  }
  .examples {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 0.5rem;
  }
  .example-chip {
    font-size: 0.8rem;
    padding: 0.4rem 0.75rem;
    border-radius: 999px;
    border: 1px solid #333;
    background: transparent;
    color: #ccc;
    cursor: pointer;
  }
  .example-chip:hover { border-color: #666; color: #fff; }

  form {
    display: flex;
    gap: 0.5rem;
    padding: 1rem 1.5rem 1.5rem;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    box-sizing: border-box;
  }
  input[type="text"] {
    flex: 1;
    padding: 0.75rem 1rem;
    border-radius: 999px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #fff;
    font-size: 1rem;
  }
  input[type="text"]:focus { outline: 1px solid #666; }
  button[type="submit"] {
    padding: 0.75rem 1.25rem;
    border-radius: 999px;
    border: none;
    background: #fff;
    color: #111;
    font-weight: 600;
    cursor: pointer;
  }
  button[type="submit"]:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <header>
    <h1>활주로 계측 AI 에이전트</h1>
    <p>진동 계측 수치는 SQL 조회로, 설계 기준·원리는 문서 검색으로 답합니다.</p>
    <a class="back-link" href="index.html">&larr; 뒤로가기</a>
  </header>

  <main id="messages">
    <div class="msg bot">
      안녕하세요. 계측 채널의 진동값·주파수 통계를 물어보거나, 활주로 설계 기준에 대해 물어보세요.
      <div class="examples">
        <button class="example-chip" type="button">ACC-04-X 채널 월별 평균 진동값 알려줘</button>
        <button class="example-chip" type="button">유도선교량 2축가속도계X 최근 일별 추이 어때</button>
        <button class="example-chip" type="button">활주로 분류기준은 어떻게 정해져?</button>
      </div>
    </div>
  </main>

  <form id="ask-form">
    <input type="text" id="question" placeholder="질문을 입력하세요" autocomplete="off" />
    <button type="submit">보내기</button>
  </form>

  <script>
    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('ask-form');
    const input = document.getElementById('question');

    function addMessage(text, role) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function ask(question) {
      addMessage(question, 'user');
      const loading = addMessage('생각 중...', 'bot loading');
      const button = form.querySelector('button');
      button.disabled = true;
      try {
        const res = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();
        loading.classList.remove('loading');
        loading.textContent = data.answer || ('오류: ' + (data.error || '알 수 없는 오류'));
      } catch (err) {
        loading.classList.remove('loading');
        loading.textContent = '요청 중 오류가 발생했습니다: ' + err.message;
      } finally {
        button.disabled = false;
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;
      input.value = '';
      ask(q);
    });

    document.querySelectorAll('.example-chip').forEach((btn) => {
      btn.addEventListener('click', () => ask(btn.textContent));
    });
  </script>
</body>
</html>
