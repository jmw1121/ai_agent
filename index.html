<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #111;
    color: #fff;
  }
  h1 {
    font-size: 3rem;
    font-weight: 600;
    margin: 0;
  }
  .weather-link {
    display: inline-block;
    padding: 0.75rem 1.5rem;
    border-radius: 999px;
    background: #fff;
    color: #111;
    text-decoration: none;
    font-weight: 600;
    font-size: 1rem;
    transition: opacity 0.15s ease;
  }
  .weather-link:hover {
    opacity: 0.85;
  }
  .db-status {
    font-size: 0.85rem;
    color: #888;
  }
  .db-status.ok { color: #6fd08c; }
  .db-status.fail { color: #ff8080; }
</style>
</head>
<body>
  <h1>Hello!</h1>
  <a class="weather-link" href="weather.html">오늘의 날씨 보기</a>
  <a class="weather-link" href="agent.html">AI 에이전트에게 묻기</a>
  <p class="db-status" id="db-status">Supabase 연결 확인 중...</p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    supabaseClient.auth.getSession()
      .then(() => {
        const el = document.getElementById('db-status');
        el.textContent = 'Supabase 연결됨';
        el.classList.add('ok');
      })
      .catch(() => {
        const el = document.getElementById('db-status');
        el.textContent = 'Supabase 연결 실패';
        el.classList.add('fail');
      });
  </script>
</body>
</html>
