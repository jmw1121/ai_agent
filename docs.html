<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문서 추가</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #111;
    color: #fff;
    padding: 2rem 1.5rem 3rem;
  }
  .page { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 0.4rem; }
  p.lede { color: #888; font-size: 0.9rem; margin: 0 0 2rem; }
  .back-link {
    display: inline-block;
    margin-top: 1.5rem;
    color: #fff;
    text-decoration: none;
    opacity: 0.7;
    font-size: 0.85rem;
  }
  .back-link:hover { opacity: 1; }

  label {
    display: block;
    font-size: 0.85rem;
    color: #aaa;
    margin: 1rem 0 0.4rem;
  }
  input[type="text"] {
    width: 100%;
    padding: 0.65rem 0.85rem;
    border-radius: 8px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #fff;
    font-size: 0.95rem;
  }
  input[type="file"] {
    width: 100%;
    padding: 0.65rem 0;
    color: #ccc;
  }
  button[type="submit"] {
    margin-top: 1.5rem;
    padding: 0.75rem 1.5rem;
    border-radius: 999px;
    border: none;
    background: #fff;
    color: #111;
    font-weight: 600;
    cursor: pointer;
  }
  button[type="submit"]:disabled { opacity: 0.5; cursor: default; }

  .status {
    margin-top: 1.25rem;
    padding: 0.85rem 1rem;
    border-radius: 8px;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    font-size: 0.9rem;
    line-height: 1.5;
    white-space: pre-wrap;
    display: none;
  }
  .status.show { display: block; }
  .status.ok { border-color: #2f5a3a; color: #8fd8a4; }
  .status.err { border-color: #5a2f2f; color: #ff9a9a; }
  .status.busy { color: #888; }

  .hint {
    margin-top: 2rem;
    font-size: 0.8rem;
    color: #666;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="page">
    <h1>문서 추가</h1>
    <p class="lede">정기 계측 보고서, 계측기 설치 보고서 등 PDF를 업로드하면 텍스트를 추출해 청크로 나누고 임베딩까지 만들어 저장합니다. 이후 AI 에이전트가 이 내용을 검색해 답변에 활용합니다.</p>

    <form id="upload-form">
      <label for="source">문서명</label>
      <input type="text" id="source" placeholder="예: 2026년 상반기 정기 계측 보고서" required />

      <label for="source_url">출처 URL (선택)</label>
      <input type="text" id="source_url" placeholder="문서 원본 링크가 있다면 입력" />

      <label for="file">PDF 파일 (최대 8MB)</label>
      <input type="file" id="file" accept="application/pdf" required />

      <button type="submit">업로드 및 인덱싱</button>
    </form>

    <div class="status" id="status"></div>

    <div class="hint">
      업로드된 문서는 텍스트로 변환 가능한 PDF만 지원합니다 (스캔 이미지로만 된 PDF는 텍스트 추출이 안 될 수 있습니다). 처리 시간은 문서 분량에 따라 수십 초 이상 걸릴 수 있습니다.
    </div>

    <a class="back-link" href="agent.html">&larr; AI 에이전트로 돌아가기</a>
  </div>

  <script>
    const form = document.getElementById('upload-form');
    const statusEl = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const source = document.getElementById('source').value.trim();
      const sourceUrl = document.getElementById('source_url').value.trim();
      const fileInput = document.getElementById('file');
      const file = fileInput.files[0];
      if (!file) return;

      const button = form.querySelector('button');
      button.disabled = true;
      statusEl.className = 'status show busy';
      statusEl.textContent = `${file.name} 업로드 중... (텍스트 추출 → 청킹 → 임베딩 순으로 진행되어 다소 걸릴 수 있습니다)`;

      try {
        const params = new URLSearchParams({ source });
        if (sourceUrl) params.set('source_url', sourceUrl);

        const res = await fetch(`/api/add-doc?${params.toString()}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/pdf' },
          body: file,
        });
        const data = await res.json();

        if (!res.ok) {
          statusEl.className = 'status show err';
          statusEl.textContent = '오류: ' + (data.error || '알 수 없는 오류');
        } else {
          statusEl.className = 'status show ok';
          statusEl.textContent = `완료: "${data.source}" 문서에서 ${data.chunk_count}개 청크(총 ${data.page_count}페이지)를 저장했습니다.`;
          form.reset();
        }
      } catch (err) {
        statusEl.className = 'status show err';
        statusEl.textContent = '요청 중 오류가 발생했습니다: ' + err.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
